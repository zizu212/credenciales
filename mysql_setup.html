<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuracion MySQL</title>
  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f6f8; color: #1f2937; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { width: 100%; max-width: 560px; background: #fff; border: 1px solid #d1d5db; border-radius: 12px; padding: 20px; box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08); }
    h2 { margin: 0 0 8px; }
    p { margin: 0 0 16px; color: #4b5563; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .full { grid-column: 1 / -1; }
    label { display: block; font-size: 13px; margin: 0 0 4px; color: #374151; }
    input { width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 8px; padding: 9px 10px; font-size: 14px; }
    .actions { display: flex; gap: 10px; margin-top: 14px; }
    button { border: none; border-radius: 8px; padding: 10px 14px; font-size: 14px; cursor: pointer; }
    #btn-test { background: #2563eb; color: #fff; }
    #btn-retry { background: #374151; color: #fff; }
    .msg { margin-top: 12px; border-radius: 8px; padding: 10px; display: none; font-size: 14px; }
    .error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .ok { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <div class="custom-titlebar"></div>
  <div class="wrap">
    <div class="card">
      <h2>Configurar MySQL</h2>
      <p>Instale/configure MySQL y capture los datos de conexion para inicializar la base <strong>credenciales</strong>.</p>

      <div class="grid">
        <div>
          <label for="host">Host</label>
          <input id="host" type="text" value="localhost">
        </div>
        <div>
          <label for="port">Puerto</label>
          <input id="port" type="number" value="3306">
        </div>
        <div>
          <label for="user">Usuario</label>
          <input id="user" type="text" value="root">
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" value="">
        </div>
        <div class="full">
          <label for="database">Base de datos</label>
          <input id="database" type="text" value="credenciales">
        </div>
      </div>

      <div class="actions">
        <button id="btn-test">Probar conexion e inicializar</button>
        <button id="btn-retry">Reintentar con configuracion guardada</button>
      </div>

      <div id="status" class="msg"></div>
    </div>
  </div>
  <script src="utils.js?v=1787933091770"></script>
  <script src="renderer_mysql_setup.js?v=1787933091770"></script>
</body>
</html>
