<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
  <title>Configuracion - Carreras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="dashboard.css?v=1783375380503" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <div class="custom-titlebar"></div>
  <div id="dashboard" style="display:block;" data-page="config_carreras">
    <div class="app-shell">
      <aside id="sidebar-slot" class="sidebar-slot"></aside>
      <main class="app-main" id="dashboard-content">
        <div class="panel">
          <h2>Configuracion de Carreras</h2>

          <form id="carrera-form" class="row g-2 align-items-end mb-3">
            <input type="hidden" id="carrera-id">
            <div class="col-md-8">
              <label for="carrera-nombre" class="form-label">Nombre de carrera</label>
              <input id="carrera-nombre" class="form-control" required>
            </div>
            <div class="col-md-1 d-grid">
              <button class="btn btn-success" type="submit">Guardar</button>
            </div>
          </form>

          <div id="carrera-status" class="alert d-none" role="alert"></div>

          <div class="table-responsive">
            <table class="table table-bordered table-hover table-sm align-middle">
              <thead class="table-dark">
                <tr>
                  <th>ID</th>
                  <th>Nombre</th>
                  <th style="width:200px;">Acciones</th>
                </tr>
              </thead>
              <tbody id="carreras-body"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js?v=1787933091770"></script>
  <script src="utils.js?v=1787933091770"></script>
  <script src="renderer_config_carreras.js?v=1787933091770"></script>
</body>
</html>
