<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credenciales - Crear Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <div class="custom-titlebar"></div>
  <div class="container mt-5" style="max-width:400px;">
    <h2 class="mb-4">Crear Nuevo Usuario</h2>
    <form id="create-user-form">
      <div class="mb-3">
        <label for="new-fullname" class="form-label">Nombre completo</label>
        <input type="text" class="form-control" id="new-fullname" required>
      </div>
      <div class="mb-3">
        <label for="new-username" class="form-label">Usuario</label>
        <input type="text" class="form-control" id="new-username" required>
      </div>
      <div class="mb-3">
        <label for="new-password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="new-password" required>
      </div>
      <div class="mb-3">
        <label for="new-role" class="form-label">Rol</label>
        <select id="new-role" class="form-select" required>
          <option value="consulta">Consulta</option>
          <option value="capturista">Capturista</option>
          <option value="admin">Administrador</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="new-plantel" class="form-label">Plantel</label>
        <select id="new-plantel" class="form-select" required>
          <option value="">Cargando planteles...</option>
        </select>
      </div>
      <button type="submit" class="btn btn-success w-100">Crear Usuario</button>
      <div id="create-user-error" class="text-danger mt-2" style="display:none;"></div>
      <div id="create-user-success" class="text-success mt-2" style="display:none;"></div>
    </form>
    <div class="mt-3 text-center">
      <a href="login.html">Volver al inicio de sesión</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js?v=1787933091770"></script>
  <script src="utils.js?v=1787933091770"></script>
  <script src="renderer_nuevo_usuario.js?v=1787933091770"></script>
</body>
</html>
