<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
  <title>Credenciales - Reportes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="dashboard.css?v=1783375380503" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <div class="custom-titlebar"></div>
  <div id="dashboard" style="display:block;" data-page="reportes">
    <div class="app-shell">
      <aside id="sidebar-slot" class="sidebar-slot"></aside>
      <main class="app-main" id="dashboard-content">
        <div class="panel">
          <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-2">
            <h2 class="mb-0">Reportes de Exportacion</h2>
            <button type="button" class="btn btn-sm btn-secondary" id="btn-refresh-reportes">Actualizar</button>
          </div>
          <div class="table-responsive">
            <table class="table table-bordered table-hover table-sm align-middle">
              <thead class="table-dark">
                <tr>
                  <th>ID</th>
                  <th>Nombre del Archivo</th>
                  <th>Cantidad de Registros</th>
                  <th>Tipo de Exportacion</th>
                  <th>Usuario Creador</th>
                  <th>Fecha</th>
                </tr>
              </thead>
              <tbody id="reportes-table-body">
                <tr>
                  <td colspan="6" class="text-center text-muted">Cargando registros...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js?v=1787933091770"></script>
  <script src="utils.js?v=1787933091770"></script>
  <script src="renderer_reportes.js?v=1787933091770"></script>
</body>
</html>
